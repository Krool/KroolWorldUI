# Thunderstore CLI (tcli) config. Used by scripts\release.ps1 -Publish, which uploads the zip
# that scripts\build.ps1 makes. Package metadata in the zip comes from thunderstore\manifest.json;
# versionNumber here is kept in sync by release.ps1.

[config]
schemaVersion = "0.0.1"

[package]
namespace = "Krool"
name = "Krool_World_UI"
versionNumber = "0.17.4"
description = "HUD/UI: character stats and resistances, death recap, boss damage/DPS meter, compass, skill XP bars, carry weight, food timers, build materials and support, crafting tabs, day/night clock, countdowns, low ammo, bench pins, auto repair. Client-side."
websiteUrl = "https://github.com/Krool/KroolWorldUI"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./thunderstore/icon.png"
readme = "./README.md"
outdir = "./dist"

[[build.copy]]
source = "./src/KroolWorldUI/bin/Release/KroolWorldUI.dll"
target = "/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["client-side", "tweaks", "utility"]
